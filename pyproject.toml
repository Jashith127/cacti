[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cacti"
version = "0.1.0"
description = "Voice-first Windows 11 desktop assistant with Needle 3 tool calling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
windows = ["pywin32>=306", "comtypes>=1.4", "pycaw>=20240210", "Pillow>=10.0"]
asr = ["onnx-asr>=0.7", "onnxruntime>=1.20", "sounddevice>=0.5", "numpy>=2.0", "pynput>=1.7"]
asr-cuda = ["onnx-asr>=0.7", "onnxruntime-gpu>=1.20", "sounddevice>=0.5", "numpy>=2.0", "pynput>=1.7"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
cacti = "cacti.assistant.loop:main"
cacti-ui = "cacti.ui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cacti"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
